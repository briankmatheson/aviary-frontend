---
kind: pipeline
type: kubernetes
name: aviary-frontend
trigger:
  branch:
    - main
  event:
    - push
    - custom
clone:
  skip_verify: true
steps:
- name: kaniko
  image: harness/kaniko
  environment:
    DRONE_OUTPUT: /tmp/drone-output.env
  settings:
    registry: registry.mesh.bmath.nyc
    repo: registry.mesh.bmath.nyc/aviary-frontend
    tags:
      - latest
      - "${DRONE_COMMIT_SHA:0:8}"
    username: mesh
    password:
      from_secret: mesh_registry_password
    skip_tls_verify: true
